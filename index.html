<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BIM EGYPT Product Price Scanner</title>
<script src="https://unpkg.com/html5-qrcode@2.3.8/html5-qrcode.min.js"></script>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;min-height:100%;background:#f1f4f8;color:#15243b;font-family:Arial,sans-serif}
main{max-width:560px;margin:auto;padding:7px}.panel{background:#fff;border-radius:15px;padding:10px;box-shadow:0 5px 18px #17243b14}
.brand{display:flex;align-items:center;gap:8px}.logo{background:#e31b23;color:#fff;font-weight:900;font-size:19px;padding:7px 10px;border-radius:9px}.brand h1{font-size:15px;margin:0}.brand small{color:#68768a;font-size:10px}
h2{margin:8px 0 3px;font-size:17px}.hint{color:#6b7280;font-size:11px;line-height:1.35}
#reader{margin:6px auto;border-radius:10px;overflow:hidden;width:100%;max-height:31vh}#reader video{object-fit:cover;max-height:31vh}
input{width:100%;padding:8px;border:1px solid #d5dce5;border-radius:9px;font-size:15px;direction:ltr;text-align:center;margin:5px 0}
button{border:0;border-radius:9px;padding:9px 10px;font-size:13px;font-weight:bold;cursor:pointer}.red{background:#e31b23;color:#fff}.blue{background:#15243b;color:#fff}.soft{background:#e9eef5;color:#15243b}
.actions{display:flex;gap:6px}.actions button{flex:1}.status{text-align:center;color:#667085;padding:4px;font-size:11px;min-height:20px}
.result{background:#f1fbfb;border:1px solid #bce9e7;border-radius:11px;padding:8px;margin-top:6px}
.price{font-size:clamp(26px,8vw,36px);font-weight:900;color:#e31b23;text-align:center;direction:ltr;line-height:1.05}.desc{text-align:center;font-size:14px;font-weight:bold;margin:4px 0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:5px;margin-top:6px}.field{background:#fff;border:1px solid #e2e8f0;border-radius:7px;padding:5px}.field label{display:block;color:#718096;font-size:9px;margin-bottom:2px}.field b{font-size:11px;word-break:break-word}
@media(max-height:740px){main{padding:4px}.panel{padding:7px}h2{margin:5px 0 2px}#reader{max-height:26vh}#reader video{max-height:26vh}.result{padding:6px}.grid{gap:4px}.field{padding:4px}}
@media(max-height:620px){.hint{display:none}#reader{max-height:22vh}#reader video{max-height:22vh}.price{font-size:26px}.field b{font-size:10px}}
</style></head>
<body><main><section class="panel">
<div class="brand"><div class="logo">BIM</div><div><h1>BIM EGYPT</h1><small>PRODUCT PRICE SCANNER</small></div></div>
<h2>سكان سعر المنتج</h2><div class="hint">وجّه الكاميرا على GS1 / EAN. عند القراءة هتسمع صوت وتظهر بيانات المنتج والسعر.</div>
<div id="reader"></div><div class="actions"><button class="red" onclick="startScan()">بدء السكان المباشر</button><button class="soft" onclick="stopScan()">إيقاف</button></div>
<div class="status" id="status">اضغط بدء السكان واسمح للكاميرا</div>
<input id="search" placeholder="اكتب GS1 أو Material" autocomplete="off">
<button class="blue" style="width:100%" onclick="lookup()">بحث عن المنتج</button>
<div class="result"><div class="desc" id="desc">بيانات المنتج هتظهر هنا</div><div class="price" id="price">—</div>
<div class="grid">
<div class="field"><label>Material</label><b id="material">—</b></div>
<div class="field"><label>Sales EAN</label><b id="ean">—</b></div>
<div class="field"><label>Per Package</label><b id="pack">—</b></div>
<div class="field"><label>BUM / وحدة البيع</label><b id="unit">—</b></div>
<div class="field" style="grid-column:1/-1"><label>Sal./Ord.Stat. Desc.</label><b id="statusdesc">—</b></div>
</div></div></section></main>
<script>
const API_URL='https://script.google.com/macros/s/AKfycbwHLWtAEqWNM256WZh121nW1AJl-s4-wLT4MBkI4zkkB5ZSv_2W5cSOa9rkQytd43at/exec';
let scanner=null,live=false,last='',lastTime=0,cbCounter=0;
function beep(){try{let C=window.AudioContext||window.webkitAudioContext,c=new C(),o=c.createOscillator(),g=c.createGain();o.frequency.value=920;g.gain.setValueAtTime(.001,c.currentTime);g.gain.exponentialRampToValueAtTime(.16,c.currentTime+.02);g.gain.exponentialRampToValueAtTime(.001,c.currentTime+.18);o.connect(g);g.connect(c.destination);o.start();o.stop(c.currentTime+.19);o.onended=()=>c.close()}catch(e){}}
function jsonp(query){return new Promise((resolve,reject)=>{let cb='bimJsonp'+(++cbCounter)+'_'+Date.now();let script=document.createElement('script');let timer=setTimeout(()=>{cleanup();reject(Error('API timeout'))},12000);function cleanup(){clearTimeout(timer);delete window[cb];script.remove()}window[cb]=data=>{cleanup();resolve(data)};script.onerror=()=>{cleanup();reject(Error('تعذر الاتصال بجدول Google'))};script.src=API_URL+'?action=product&barcode='+encodeURIComponent(query)+'&callback='+cb;document.body.appendChild(script)})}
async function lookup(code){code=String(code||document.getElementById('search').value||'').trim();if(!code){document.getElementById('status').textContent='اكتب أو امسح الكود';return}document.getElementById('search').value=code;document.getElementById('status').textContent='جاري البحث عن المنتج...';try{let d=await jsonp(code);if(!d.found){document.getElementById('status').textContent=d.message||'المنتج غير موجود';return}document.getElementById('desc').textContent=d.desc||'Product';document.getElementById('price').textContent=(d.price||'—')+' EGP';document.getElementById('material').textContent=d.material||'—';document.getElementById('ean').textContent=d.ean||'—';document.getElementById('pack').textContent=d.pack||'—';document.getElementById('unit').textContent=d.unit||'—';document.getElementById('statusdesc').textContent=d.status||'—';document.getElementById('status').textContent='تم العثور على المنتج ✓'}catch(e){document.getElementById('status').textContent=e.message+' — راجع نشر Apps Script كـ Anyone'}}
function onScan(text){let now=Date.now();if(text===last&&now-lastTime<1800)return;last=text;lastTime=now;beep();lookup(text)}
async function startScan(){if(live)return;if(!window.Html5Qrcode){document.getElementById('status').textContent='تعذر تحميل مكتبة السكانر';return}scanner=new Html5Qrcode('reader');document.getElementById('status').textContent='تشغيل الكاميرا...';try{await scanner.start({facingMode:'environment'},{fps:12,qrbox:{width:Math.min(270,Math.floor(window.innerWidth*0.78)),height:Math.min(145,Math.floor(window.innerHeight*0.20))},formatsToSupport:[Html5QrcodeSupportedFormats.EAN_13,Html5QrcodeSupportedFormats.EAN_8,Html5QrcodeSupportedFormats.UPC_A,Html5QrcodeSupportedFormats.UPC_E,Html5QrcodeSupportedFormats.CODE_128,Html5QrcodeSupportedFormats.CODE_39,Html5QrcodeSupportedFormats.ITF,Html5QrcodeSupportedFormats.QR_CODE]},onScan,()=>{});live=true;document.getElementById('status').textContent='السكان شغال — وجّه الباركود داخل الإطار'}catch(e){document.getElementById('status').textContent='رفض إذن الكاميرا: '+(e.message||e)}}
async function stopScan(){if(scanner&&live){try{await scanner.stop();await scanner.clear()}catch(e){}live=false}document.getElementById('status').textContent='تم إيقاف السكان'}
document.getElementById('search').addEventListener('keydown',e=>{if(e.key==='Enter')lookup()});
</script></body></html>
